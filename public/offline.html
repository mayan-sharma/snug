<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>Offline · Snug</title>
        <style>
            :root {
                --paper: #0a0a12;
                --ink: #f4f4e8;
                --muted: #8d8fa8;
                --accent: #ffd60a;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --paper: #0a0a12;
                    --ink: #f4f4e8;
                    --muted: #8d8fa8;
                    --accent: #ffd60a;
                }
            }
            body {
                margin: 0;
                font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
                background: var(--paper);
                color: var(--ink);
                min-height: 100dvh;
                display: flex;
                align-items: center;
                padding: 0 28px;
                box-sizing: border-box;
                -webkit-font-smoothing: antialiased;
            }
            .card {
                max-width: 440px;
            }
            h1 {
                margin: 0;
                font-size: clamp(1.75rem, 8vw, 2.5rem);
                text-transform: uppercase;
                font-weight: 800;
                line-height: 1.05;
                letter-spacing: 0;
            }
            p {
                margin: 16px 0 0;
                color: var(--muted);
                font-size: 1.0625rem;
                line-height: 1.5;
            }
            a.retry {
                display: inline-block;
                margin-top: 16px;
                padding: 12px 0;
                color: var(--accent);
                font-weight: 650;
                text-decoration: none;
            }
            a.retry:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>No room here.</h1>
            <p>You're offline and this page wasn't saved yet. The game itself works offline once you have opened it. Reconnect to load this page.</p>
            <a class="retry" href="catalyst://retry">Try again</a>
        </div>
    </body>
</html>
